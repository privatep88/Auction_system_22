name: Deploy SAAED Vehicle Auctions to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify Vite Production Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "^24.12.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies cleanly
        run: npm ci

      - name: TypeScript typecheck
        run: npm run lint

      - name: Run 18-point financial & operational integrity suite
        run: npm test

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Resolve GitHub Pages base path
        id: pages_config
        shell: bash
        run: |
          RAW_BASE="${{ steps.pages.outputs.base_path }}"
          ORIGIN="${{ steps.pages.outputs.origin }}"
          BASE_URL="${{ steps.pages.outputs.base_url }}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          if [[ -n "$RAW_BASE" && "$RAW_BASE" != "/" ]]; then
            NORMALIZED="/${RAW_BASE#/}"
            NORMALIZED="${NORMALIZED%/}/"
            echo "base_path=${NORMALIZED}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$BASE_URL" && -n "$ORIGIN" && "${BASE_URL#"$ORIGIN"}" != "" && "${BASE_URL#"$ORIGIN"}" != "/" ]]; then
            EXTRACTED="${BASE_URL#"$ORIGIN"}"
            NORMALIZED="/${EXTRACTED#/}"
            NORMALIZED="${NORMALIZED%/}/"
            echo "base_path=${NORMALIZED}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$ORIGIN" && "$ORIGIN" != *.github.io && "$ORIGIN" != *.github.io:* ]]; then
            # Verified custom domain configured on GitHub Pages
            echo "base_path=/" >> "$GITHUB_OUTPUT"
          elif [[ "$REPO_NAME" == *.github.io ]]; then
            echo "base_path=/" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build production bundle
        env:
          VITE_BASE_PATH: ${{ steps.pages_config.outputs.base_path }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_FIRESTORE_DATABASE_ID: ${{ vars.VITE_FIREBASE_FIRESTORE_DATABASE_ID || secrets.VITE_FIREBASE_FIRESTORE_DATABASE_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID || secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Verify production bundle integrity
        env:
          EXPECTED_BASE: ${{ steps.pages_config.outputs.base_path }}
        shell: bash
        run: |
          echo "Verified VITE_BASE_PATH=${EXPECTED_BASE}"
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.nojekyll
          test -d dist/assets
          test -f dist/assets/aistudio/logo_1afd1154.png
          if grep -qE "/src/(main|index)\.tsx" dist/index.html dist/404.html; then
            echo "ERROR: Uncompiled source entry reference found in dist HTML"
            exit 1
          fi
          if ! grep -qE "${EXPECTED_BASE}assets/index-[^\"]+\.js" dist/index.html; then
            echo "ERROR: Built Vite JS entry with base '${EXPECTED_BASE}' missing from dist/index.html"
            cat dist/index.html
            exit 1
          fi
          if ! grep -qE "${EXPECTED_BASE}assets/index-[^\"]+\.css" dist/index.html; then
            echo "ERROR: Built Vite CSS bundle with base '${EXPECTED_BASE}' missing from dist/index.html"
            cat dist/index.html
            exit 1
          fi
          ls -lh dist dist/assets

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
